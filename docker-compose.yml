version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sdcm-postgres
    restart: always
    environment:
      POSTGRES_DB: sdcm_db
      POSTGRES_USER: sdcm_user
      POSTGRES_PASSWORD: Lteoi@31_secure_pass
      TZ: America/Bahia
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - traefik-public

  web:
    image: richarvey/nginx-php-fpm:latest
    container_name: site-sdcm
    restart: always
    environment:
      - WEBROOT=/var/www/html
      - PHP_ERRORS_STDERR=1
      - RUN_SCRIPTS=0
      - REAL_IP_HEADER=1
      - TZ=America/Bahia
    volumes:
      - ./html:/var/www/html
    networks:
      - traefik-public
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.rule=Host(`sdcm.smartnoc.com.br`)"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.services.web.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
